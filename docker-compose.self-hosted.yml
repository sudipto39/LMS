version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# GiteaForge LMS — Self-Hosted Production Stack (Ubuntu Server 10.0.22.109)
# Services: Gitea (3000), Judge0 (2358), PostgreSQL (5432), Redis (6379)
# All storage is local and persistent. Zero AWS S3 or external cloud required.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. LMS PostgreSQL Database ──────────────────────────────────────────────
  lms-postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lms_pg_data:/var/lib/postgresql/data

  # ── 2. LMS Redis Cache ──────────────────────────────────────────────────────
  lms-redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - lms_redis_data:/data

  # ── 3. Gitea Self-Hosted Git Service ─────────────────────────────────────────
  gitea:
    image: gitea/gitea:latest
    container_name: lms-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://10.0.22.109:3000
      - GITEA__webhook__ALLOWED_HOST_LIST=127.0.0.1,localhost,10.0.22.109,lms-server
      - GITEA__security__INSTALL_LOCK=true
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data

  # ── 4. Judge0 Code Execution API Server ──────────────────────────────────────
  judge0-server:
    image: judge0/judge0:latest
    container_name: judge0-server
    restart: unless-stopped
    depends_on:
      - judge0-redis
      - judge0-postgres
    ports:
      - "127.0.0.1:2358:2358"
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?JUDGE0_POSTGRES_PASSWORD must be provided in .env}
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  # ── 5. Judge0 Sandbox Worker ────────────────────────────────────────────────
  judge0-worker:
    image: judge0/judge0:latest
    container_name: judge0-worker
    restart: unless-stopped
    command: ["./scripts/workers"]
    depends_on:
      - judge0-redis
      - judge0-postgres
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?JUDGE0_POSTGRES_PASSWORD must be provided in .env}
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    restart: unless-stopped
    volumes:
      - judge0_redis_data:/data

  judge0-postgres:
    image: postgres:15-alpine
    container_name: judge0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?JUDGE0_POSTGRES_PASSWORD must be provided in .env}
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data

volumes:
  lms_pg_data:
  lms_redis_data:
  gitea_data:
  judge0_redis_data:
  judge0_pg_data:
